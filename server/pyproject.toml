[project]
name = "harbor-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "shapely>=2.0",
    "pydantic-ai-slim[openai]>=2.57.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
tools = ["pyshp>=2.3"]  # offline data builders in tools/

[tool.uv]
package = false  # an app, not a library: nothing gets built or installed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]  # tests/<category>.py
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "PT", "N", "ASYNC", "PERF"]
ignore = [
    "E501",    # the formatter owns line length; long user-facing strings stay readable
    "E741",    # `l` for a budget line reads fine here
    "N818",    # Nessie* exception names are part of the bank API
    "PERF401", # explicit append loops read better than nested comprehensions here
    "PT018",   # compound asserts keep related checks together
    "RUF001", "RUF002", "RUF003",  # × and – are intentional in user-facing text
]
