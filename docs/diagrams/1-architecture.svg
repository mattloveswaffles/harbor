<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img"><title>Harbor backend architecture</title><desc>Data inputs feed the FastAPI backend: ingest, risk engine, evacuation guide, plan engine, AI review, executor and event bus, which move money in Nessie and the ETF portfolio and update the website.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect width="680" height="680" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="58" text-anchor="middle" dominant-baseline="central">Forecasts</text><text class="ts" x="110" y="78" text-anchor="middle" dominant-baseline="central">NHC + NWS alerts</text></g>
<g class="c-teal"><rect x="193" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="58" text-anchor="middle" dominant-baseline="central">Sensors</text><text class="ts" x="263" y="78" text-anchor="middle" dominant-baseline="central">Tides and rivers</text></g>
<g class="c-teal"><rect x="346" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="416" y="58" text-anchor="middle" dominant-baseline="central">Market prices</text><text class="ts" x="416" y="78" text-anchor="middle" dominant-baseline="central">T. Rowe ETF closes</text></g>
<g class="c-teal"><rect x="499" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="569" y="58" text-anchor="middle" dominant-baseline="central">Travel data</text><text class="ts" x="569" y="78" text-anchor="middle" dominant-baseline="central">Routes, shelters</text></g>
<rect x="40" y="120" width="600" height="414" rx="20" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="110" y1="96" x2="110" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="263" y1="96" x2="263" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="416" y1="96" x2="416" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="569" y1="96" x2="569" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="70" y="160" width="540" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Data ingest</text><text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">Pollers on the live or demo clock save every reading</text></g>
<text class="ts" x="330" y="236" text-anchor="middle" dominant-baseline="central">Harbor backend (FastAPI + SQLite)</text>
<line x1="150" y1="216" x2="150" y2="254" class="arr" marker-end="url(#arrow)"/>
<line x1="515" y1="216" x2="515" y2="254" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="70" y="256" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="274" text-anchor="middle" dominant-baseline="central">Risk engine</text><text class="ts" x="220" y="294" text-anchor="middle" dominant-baseline="central">Sets each user's risk level</text></g>
<g class="c-coral"><rect x="420" y="256" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="274" text-anchor="middle" dominant-baseline="central">Evacuation guide</text><text class="ts" x="515" y="294" text-anchor="middle" dominant-baseline="central">Route, shelters, hotels</text></g>
<line x1="220" y1="312" x2="220" y2="350" class="arr" marker-end="url(#arrow)"/>
<path d="M515 312 L515 332 L395 332 L395 370 L372 370" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="70" y="352" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="370" text-anchor="middle" dominant-baseline="central">Plan engine</text><text class="ts" x="220" y="390" text-anchor="middle" dominant-baseline="central">Budget, money sources, timing</text></g>
<g class="c-coral"><rect x="420" y="352" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="370" text-anchor="middle" dominant-baseline="central">AI review</text><text class="ts" x="515" y="390" text-anchor="middle" dominant-baseline="central">Explains, never decides</text></g>
<line x1="372" y1="390" x2="418" y2="390" class="arr" marker-end="url(#arrow)"/>
<line x1="220" y1="408" x2="220" y2="446" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="70" y="448" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="466" text-anchor="middle" dominant-baseline="central">Executor</text><text class="ts" x="220" y="486" text-anchor="middle" dominant-baseline="central">Runs each approved move once</text></g>
<g class="c-purple"><rect x="420" y="448" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="466" text-anchor="middle" dominant-baseline="central">Event bus</text><text class="ts" x="515" y="486" text-anchor="middle" dominant-baseline="central">Logs and pushes updates</text></g>
<line x1="372" y1="476" x2="418" y2="476" class="arr" marker-end="url(#arrow)"/>
<line x1="150" y1="504" x2="150" y2="572" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="504" x2="337" y2="572" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="506" x2="535" y2="572" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="60" y="574" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="592" text-anchor="middle" dominant-baseline="central">Nessie bank</text><text class="ts" x="150" y="612" text-anchor="middle" dominant-baseline="central">Transfers, cash, bills</text></g>
<g class="c-teal"><rect x="255" y="574" width="165" height="56" rx="8" stroke-width="0.5"/><text class="th" x="337" y="592" text-anchor="middle" dominant-baseline="central">ETF portfolio</text><text class="ts" x="337" y="612" text-anchor="middle" dominant-baseline="central">Sell and rebuy ETFs</text></g>
<g class="c-teal"><rect x="440" y="574" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="535" y="592" text-anchor="middle" dominant-baseline="central">Website</text><text class="ts" x="535" y="612" text-anchor="middle" dominant-baseline="central">Map, plan, live updates</text></g>
<rect x="40" y="648" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="58" y="654" dominant-baseline="central">Outside Harbor</text>
<rect x="190" y="648" width="12" height="12" rx="2" class="c-purple" stroke-width="0.5"/><text class="ts" x="208" y="654" dominant-baseline="central">Core rules and money</text>
<rect x="380" y="648" width="12" height="12" rx="2" class="c-coral" stroke-width="0.5"/><text class="ts" x="398" y="654" dominant-baseline="central">People: travel and AI review</text>
</svg>
