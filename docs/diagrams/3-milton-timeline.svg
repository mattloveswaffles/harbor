<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img"><title>Maria's week during the Hurricane Milton replay</title><desc>Day by day from Saturday 5 October to Friday 11 October 2024: what the storm does and what Harbor does with Maria's money and evacuation.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F8F7F3;stroke:#B4B2A9}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect width="680" height="610" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="40" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="58" text-anchor="middle" dominant-baseline="central">Sat 5 Oct</text><text class="ts" x="100" y="78" text-anchor="middle" dominant-baseline="central">Monitor</text>
<rect class="box" x="40" y="116" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="134" text-anchor="middle" dominant-baseline="central">Sun 6 Oct</text><text class="ts" x="100" y="154" text-anchor="middle" dominant-baseline="central">Prepare</text>
<rect class="box" x="40" y="192" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="210" text-anchor="middle" dominant-baseline="central">Mon 7 Oct</text><text class="ts" x="100" y="230" text-anchor="middle" dominant-baseline="central">Prepare</text>
<rect class="box" x="40" y="268" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="286" text-anchor="middle" dominant-baseline="central">Tue 8 Oct</text><text class="ts" x="100" y="306" text-anchor="middle" dominant-baseline="central">Act</text>
<rect class="box" x="40" y="344" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="362" text-anchor="middle" dominant-baseline="central">Wed 9 Oct</text><text class="ts" x="100" y="382" text-anchor="middle" dominant-baseline="central">Shelter</text>
<rect class="box" x="40" y="420" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="438" text-anchor="middle" dominant-baseline="central">Thu 10 Oct</text><text class="ts" x="100" y="458" text-anchor="middle" dominant-baseline="central">Recovery hold</text>
<rect class="box" x="40" y="496" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="514" text-anchor="middle" dominant-baseline="central">Sun 13 Oct</text><text class="ts" x="100" y="534" text-anchor="middle" dominant-baseline="central">Recover</text>
<line x1="160" y1="68" x2="178" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="144" x2="178" y2="144" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="220" x2="178" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="296" x2="178" y2="296" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="372" x2="178" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="448" x2="178" y2="448" class="arr" marker-end="url(#arrow)"/>
<line x1="160" y1="524" x2="178" y2="524" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="180" y="40" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="58" dominant-baseline="central">Milton forms in the Gulf</text><text class="ts" x="200" y="78" dominant-baseline="central">Harbor starts tracking it and alerts Maria; no money moves</text></g>
<g class="c-coral"><rect x="180" y="116" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="134" text-anchor="start" dominant-baseline="central">Wind chance at 33602 reaches 23%</text><text class="ts" x="200" y="154" dominant-baseline="central">Plan, AI review and evacuation guide built; Maria approves</text></g>
<g class="c-coral"><rect x="180" y="192" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="210" dominant-baseline="central">Markets open: money starts moving</text><text class="ts" x="200" y="230" dominant-baseline="central">Nessie transfer from savings; TBUX sold at 10 am, settles tomorrow (T+1)</text></g>
<g class="c-coral"><rect x="180" y="268" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="286" dominant-baseline="central">Sale settles, cash in hand, family leaves</text><text class="ts" x="200" y="306" dominant-baseline="central">Deposit and transfer to checking, $320 withdrawn, drive to Valdosta</text></g>
<g class="c-coral"><rect x="180" y="344" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="362" dominant-baseline="central">Landfall: Milton comes ashore</text><text class="ts" x="200" y="382" dominant-baseline="central">Money moves frozen; surge and wind alerts from the gauges</text></g>
<g class="c-coral"><rect x="180" y="420" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="438" dominant-baseline="central">Alerts end, but the Alafia River is still rising</text><text class="ts" x="200" y="458" dominant-baseline="central">Recovery hold: river crests Fri at 24.36 ft; cash stays in checking</text></g>
<g class="c-teal"><rect x="180" y="496" width="460" height="56" rx="8" stroke-width="0.5"/><text class="th" x="200" y="514" dominant-baseline="central">River out of major flood and falling</text><text class="ts" x="200" y="534" dominant-baseline="central">Unspent cash back to savings; AI wrap-up report</text></g>
<rect x="40" y="574" width="12" height="12" rx="2" class="c-gray" stroke-width="0.5"/><text class="ts" x="58" y="580" dominant-baseline="central">Watching</text>
<rect x="150" y="574" width="12" height="12" rx="2" class="c-coral" stroke-width="0.5"/><text class="ts" x="168" y="580" dominant-baseline="central">Storm threat, money and family in motion</text>
<rect x="450" y="574" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="468" y="580" dominant-baseline="central">Restoring</text>
</svg>
