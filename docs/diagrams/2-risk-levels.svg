<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img"><title>Harbor risk levels and money actions</title><desc>Six risk levels from clear to recover, each with its trigger and what Harbor does with the money and the family at that level.</desc>
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F8F7F3;stroke:#B4B2A9}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect width="680" height="560" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="58" text-anchor="middle" dominant-baseline="central">Clear</text><text class="ts" x="125" y="78" text-anchor="middle" dominant-baseline="central">No storm near</text></g>
<g class="c-gray"><rect x="40" y="116" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="134" text-anchor="middle" dominant-baseline="central">Monitor</text><text class="ts" x="125" y="154" text-anchor="middle" dominant-baseline="central">Wind chance over 5%</text></g>
<g class="c-coral"><rect x="40" y="192" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="210" text-anchor="middle" dominant-baseline="central">Prepare</text><text class="ts" x="125" y="230" text-anchor="middle" dominant-baseline="central">Over 20% or sensors</text></g>
<g class="c-coral"><rect x="40" y="268" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="286" text-anchor="middle" dominant-baseline="central">Act</text><text class="ts" x="125" y="306" text-anchor="middle" dominant-baseline="central">Over 50% or a watch</text></g>
<g class="c-coral"><rect x="40" y="344" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="362" text-anchor="middle" dominant-baseline="central">Shelter</text><text class="ts" x="125" y="382" text-anchor="middle" dominant-baseline="central">Winds within 12h</text></g>
<g class="c-teal"><rect x="40" y="420" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="438" text-anchor="middle" dominant-baseline="central">Recover</text><text class="ts" x="125" y="458" text-anchor="middle" dominant-baseline="central">Sensors say all-clear</text></g>
<line x1="125" y1="96" x2="125" y2="114" class="arr" marker-end="url(#arrow)"/>
<line x1="125" y1="172" x2="125" y2="190" class="arr" marker-end="url(#arrow)"/>
<line x1="125" y1="248" x2="125" y2="266" class="arr" marker-end="url(#arrow)"/>
<line x1="125" y1="324" x2="125" y2="342" class="arr" marker-end="url(#arrow)"/>
<line x1="125" y1="400" x2="125" y2="418" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="68" x2="246" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="144" x2="246" y2="144" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="220" x2="246" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="296" x2="246" y2="296" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="372" x2="246" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="448" x2="246" y2="448" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="248" y="40" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="58" dominant-baseline="central">Watch quietly</text><text class="ts" x="268" y="78" dominant-baseline="central">Pollers keep running, no money moves</text>
<rect class="box" x="248" y="116" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="134" dominant-baseline="central">Track the storm</text><text class="ts" x="268" y="154" dominant-baseline="central">Alert the family, still no money moves</text>
<rect class="box" x="248" y="192" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="210" dominant-baseline="central">Build the plan</text><text class="ts" x="268" y="230" dominant-baseline="central">Budget, route, hotels and AI review; the user approves</text>
<rect class="box" x="248" y="268" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="286" dominant-baseline="central">Move the money</text><text class="ts" x="268" y="306" dominant-baseline="central">Savings to checking, sell ETFs, withdraw cash</text>
<rect class="box" x="248" y="344" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="362" dominant-baseline="central">Hold steady</text><text class="ts" x="268" y="382" dominant-baseline="central">Money moves frozen, sensor safety alerts</text>
<rect class="box" x="248" y="420" width="392" height="56" rx="8" stroke-width="0.5"/><text class="th" x="268" y="438" dominant-baseline="central">Put it back</text><text class="ts" x="268" y="458" dominant-baseline="central">Once rivers fall: restore unspent cash, rebuy ETFs</text>
<text class="ts" x="40" y="500" dominant-baseline="central">↻ Back to clear after recovery. If the storm turns away, moves are cancelled or reversed.</text>
<rect x="40" y="524" width="12" height="12" rx="2" class="c-gray" stroke-width="0.5"/><text class="ts" x="58" y="530" dominant-baseline="central">Watching only</text>
<rect x="170" y="524" width="12" height="12" rx="2" class="c-coral" stroke-width="0.5"/><text class="ts" x="188" y="530" dominant-baseline="central">Storm threat, money in motion</text>
<rect x="410" y="524" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="428" y="530" dominant-baseline="central">Restoring</text>
</svg>
