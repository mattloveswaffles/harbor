<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor frontend check</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 760px; background: #fff; color: #222; }
  li { margin: 4px 0; } .pass { color: #0f6e56; } .fail { color: #a32d2d; font-weight: 600; }
  code { background: #f1efe8; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Harbor frontend check</h1>
<p>Served from <code>localhost:3000</code> like the Next.js site, calling the backend at
<code id="api"></code> the way the website will: CORS, Bearer login, the live stream and the main screens.</p>
<p id="summary">Running…</p>
<ol id="out"></ol>
<script>
const API = (new URLSearchParams(location.search).get("api") || "http://localhost:8000") + "/api/v1";
document.getElementById("api").textContent = API;
const out = document.getElementById("out");
let passed = 0, failed = 0, token = null;

function report(ok, name, detail) {
  const li = document.createElement("li");
  li.className = ok ? "pass" : "fail";
  li.textContent = `${ok ? "PASS" : "FAIL"} ${name}${detail ? " — " + detail : ""}`;
  out.appendChild(li);
  ok ? passed++ : failed++;
}

async function call(method, path, body, auth = true) {
  const headers = { "Content-Type": "application/json" };
  if (auth && token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let json = null;
  try { json = await res.json(); } catch {}
  return { status: res.status, json, serverTime: res.headers.get("X-Server-Time") };
}

async function step(name, fn) {
  try { const d = await fn(); report(true, name, d); } catch (e) { report(false, name, e.message); }
}
const must = (cond, msg) => { if (!cond) throw new Error(msg); };

(async () => {
  const email = `check-${Date.now()}@example.com`;
  await step("Sign up (CORS preflight + JSON body)", async () => {
    const r = await call("POST", "/auth/signup", { email, password: "frontend-check-pw", name: "Frontend Check", zip: "33602" }, false);
    must(r.status === 201, `status ${r.status} ${JSON.stringify(r.json)}`);
    token = r.json.token;
    return `user ${r.json.user.id}, token ${token.slice(0, 8)}…`;
  });
  await step("Log in with email and password", async () => {
    const r = await call("POST", "/auth/login", { email, password: "frontend-check-pw" }, false);
    must(r.status === 200 && r.json.token, `status ${r.status}`);
    token = r.json.token;
    return "new token issued";
  });
  await step("Bearer token works and X-Server-Time is readable", async () => {
    const r = await call("GET", "/auth/me");
    must(r.status === 200, `status ${r.status}`);
    must(r.serverTime, "X-Server-Time header not exposed to the browser");
    return `${r.json.name}, server time ${r.serverTime}`;
  });
  await step("Wrong password is refused", async () => {
    const r = await call("POST", "/auth/login", { email, password: "nope" }, false);
    must(r.status === 401 && r.json.error.code === "invalid_credentials", `status ${r.status}`);
    return "401 invalid_credentials";
  });

  let streamed = [];
  let es;
  await step("Live stream opens with ?token= (EventSource, cross-origin)", async () => {
    es = new EventSource(`${API}/me/events/stream?token=${encodeURIComponent(token)}`);
    es.onmessage = (m) => streamed.push(JSON.parse(m.data).type);
    await new Promise((ok, bad) => { es.onopen = ok; setTimeout(() => bad(new Error("did not open in 5 s")), 5000); });
    return "connected";
  });

  await step("Start the Milton replay", async () => {
    const r = await call("POST", "/demo/start", { storm: "milton-2024", speed: 1800 });
    must(r.status === 200, `status ${r.status}`);
    return `clock ${r.json.now}, ${r.json.running ? "running" : "paused: " + r.json.paused_reason}`;
  });
  await step("Storm status", async () => {
    const r = await call("GET", "/me/storm");
    must(r.status === 200 && r.json.storm, `status ${r.status}`);
    return `${r.json.storm.name}, risk ${r.json.risk_level}`;
  });
  let plan;
  await step("Plan is waiting for approval", async () => {
    const r = await call("GET", "/me/plan");
    plan = r.json.plan;
    must(plan && plan.status === "awaiting_approval", `plan ${plan && plan.status}`);
    return `$${plan.budget.total_cents / 100}, ${plan.moves.length} moves`;
  });
  await step("AI plan review", async () => {
    const r = await call("GET", "/me/plan/review");
    must(r.status === 200 && r.json.label, `status ${r.status}`);
    return `${r.json.generated_by}, validated ${r.json.validated}`;
  });
  await step("Evacuation guide", async () => {
    const r = await call("GET", "/me/evacuation");
    must(r.status === 200 && r.json.decision, `status ${r.status}`);
    return `${r.json.decision.action} to ${r.json.chosen}, leave by ${r.json.leave_by}`;
  });
  await step("Map layers are GeoJSON", async () => {
    const r = await call("GET", "/me/map");
    const counts = Object.entries(r.json.layers).map(([k, v]) => `${k}=${v.features.length}`).join(" ");
    must(r.json.layers.cone.features.length && r.json.layers.route.features.length, counts);
    return counts;
  });
  await step("Approve the plan", async () => {
    const r = await call("POST", "/me/plan/approve", { plan_version: plan.version });
    must(r.status === 200 && r.json.plan.status === "approved", `status ${r.status}`);
    return "approved";
  });
  await step("Live events arrive while the clock runs", async () => {
    await new Promise((ok) => setTimeout(ok, 7000));
    must(streamed.includes("move_done"), `got: ${streamed.join(", ") || "nothing"}`);
    return streamed.join(", ");
  });
  es && es.close();
  await step("Log out ends the token", async () => {
    const r = await call("POST", "/auth/logout");
    must(r.status === 204, `status ${r.status}`);
    const after = await call("GET", "/me");
    must(after.status === 401 && after.json.error.code === "invalid_token", `after logout: ${after.status}`);
    return "204, then 401 invalid_token";
  });

  const summary = `${failed ? "FAILED" : "ALL PASSED"}: ${passed} passed, ${failed} failed`;
  document.getElementById("summary").textContent = summary;
  document.title = summary;
})();
</script>
</body>
</html>
