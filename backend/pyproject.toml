[project]
name = "harbor-backend"
version = "0.1.0"
description = "Harbor: moves your money and plans your evacuation before a hurricane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "anthropic>=0.40",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Offline data builders in tools/ (fetch_replay.py reads NHC shapefiles)
tools = ["pyshp>=2.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harbor*"]

[tool.setuptools.package-data]
harbor = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
